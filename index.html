<title>ECMO・PCPSバイブル MCQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-column quiz card with a sticky status bar; question map below. Circuit-chart palette: oxygenated teal accent, cool neutrals. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --fg:#17242a; --muted:#5b6c73; --line:#d6dfe2;
  --accent:#0d6f7c; --accent-soft:#e1f0f2;
  --ok:#1f7a45; --ok-soft:#e3f3e8; --ng:#b3261e; --ng-soft:#fbe7e5; --flag:#a86b00;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#172225; --fg:#e4ecee; --muted:#93a4aa; --line:#2a3a3f;
  --accent:#5cc3cf; --accent-soft:#163a3f;
  --ok:#5fcf8a; --ok-soft:#143322; --ng:#ff8a80; --ng-soft:#3d1a18; --flag:#f0b44c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172225; --fg:#e4ecee; --muted:#93a4aa; --line:#2a3a3f;
  --accent:#5cc3cf; --accent-soft:#163a3f;
  --ok:#5fcf8a; --ok-soft:#143322; --ng:#ff8a80; --ng-soft:#3d1a18; --flag:#f0b44c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-weight:700;font-size:15px;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.04em}
.stats{display:flex;gap:14px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.stats b{font-weight:600}
.stats .ok{color:var(--ok)} .stats .ng{color:var(--ng)}
.meter{height:4px;background:var(--line);width:100%}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.qno{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:14px}
.pos{font-family:var(--mono);color:var(--muted);font-size:12px;margin-left:auto}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.tag.ok{color:var(--ok)} .tag.ng{color:var(--ng)}
.qtext{font-size:16px;font-weight:500;margin:0 0 16px;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font-family:var(--mono);font-weight:600;min-width:1.2em;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{color:var(--ok)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.wrong .k{color:var(--ng)}
.verdict{margin-top:16px;padding:14px 16px;border-radius:8px;border-left:4px solid var(--ok);background:var(--ok-soft)}
.verdict.ng{border-left-color:var(--ng);background:var(--ng-soft)}
.verdict h3{margin:0 0 4px;font-size:15px}
.verdict p{margin:0;font-size:14px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn[disabled]{opacity:.4;cursor:default}
.empty{color:var(--muted);text-align:center;padding:28px 8px}
h2.sec{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.cell{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;font-family:var(--mono);font-size:11px;cursor:pointer;padding:0}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.legend .l-ok::before{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-ng::before{background:var(--ng-soft);border-color:var(--ng)}
.review{display:grid;gap:12px}
.ritem{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:8px;padding:14px 16px}
.ritem .qt{font-weight:500;margin:4px 0 8px}
.ritem ul{margin:0 0 8px;padding-left:0;list-style:none;font-size:14px}
.ritem li{padding:2px 0}
.ritem li.c{color:var(--ok);font-weight:700}
.ritem li.y{color:var(--ng);text-decoration:line-through}
.ritem .ex{font-size:14px;background:var(--bg);border-radius:6px;padding:8px 10px;margin:0}
.save{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:12px;color:var(--muted)}
textarea{width:100%;min-height:72px;font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px}
.panel p{margin:0;font-size:13px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.src{font-size:12px;color:var(--muted);margin-top:24px}
@media (max-width:480px){.card{padding:16px}.grid{grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}.cell{font-size:9px}}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand">ECMO・PCPSバイブル MCQ<small>5択 100問・本文準拠</small></div>
    <div class="stats" aria-live="polite">
      <span>解答 <b id="sDone">0</b>/100</span>
      <span class="ok">正解 <b id="sOk">0</b></span>
      <span class="ng">誤答 <b id="sNg">0</b></span>
      <span>正答率 <b id="sRate">–</b></span>
    </div>
  </div>
  <div class="meter"><i id="meter"></i></div>
</header>

<div class="wrap">
  <div class="modes" role="group" aria-label="出題範囲">
    <button class="chip" id="mAll" aria-pressed="true">全問</button>
    <button class="chip" id="mTodo" aria-pressed="false">未解答のみ</button>
    <button class="chip" id="mWrong" aria-pressed="false">間違えた問題</button>
    <button class="chip" id="mReview" aria-pressed="false">誤答の解説一覧</button>
  </div>

  <section id="quiz">
    <div class="card" id="card"></div>
    <div class="nav">
      <button class="btn" id="prev">← 前へ</button>
      <button class="btn" id="redo" hidden>この問題を解き直す</button>
      <button class="btn primary" id="next">次へ →</button>
    </div>
  </section>

  <section id="reviewSec" hidden>
    <div class="review" id="review"></div>
  </section>

  <h2 class="sec">問題マップ</h2>
  <div class="grid" id="grid"></div>
  <div class="legend"><span class="l-ok">正解</span><span class="l-ng">誤答</span><span>未解答</span></div>

  <h2 class="sec">一時保存</h2>
  <div class="panel">
    <div class="save">
      <button class="btn primary" id="saveBtn">今すぐ保存</button>
      <span class="status" id="saveStatus">解答するたびにこのブラウザへ自動保存します。</span>
    </div>
    <p>別の端末やブラウザで続きをする場合は、下の進捗コードをコピーし、移行先で貼り付けて「読み込む」を押してください。</p>
    <textarea id="code" aria-label="進捗コード" spellcheck="false"></textarea>
    <div class="save">
      <button class="btn" id="copyBtn">コードをコピー</button>
      <button class="btn" id="loadBtn">貼り付けたコードを読み込む</button>
      <button class="btn" id="resetBtn">最初からやり直す</button>
    </div>
    <div class="confirm" id="resetConfirm" hidden>
      <span>すべての解答記録を消去します。</span>
      <button class="btn" id="resetYes" style="border-color:var(--ng);color:var(--ng)">消去する</button>
      <button class="btn" id="resetNo">キャンセル</button>
    </div>
  </div>

  <p class="src">出典：日本呼吸療法医学会・日本経皮的心肺補助研究会 編『ECMO・PCPSバイブル』メディカ出版。各解説の（p●）は書籍ページ。</p>
</div>

<script>
const Q = [{"n":1,"q":"本書（PCPS研究会）によるPCPSの定義の要素として記載されていないものはどれか。","o":["閉鎖回路","遠心ポンプ","膜型人工肺","貯血槽付き開放回路","大腿動静脈経由での心肺補助"],"a":3,"e":"PCPSは「遠心ポンプと膜型人工肺を用いた閉鎖回路の人工心肺装置により、大腿動静脈経由で心肺補助を行うもの」。貯血槽を省いた閉鎖回路が特徴。(p3)"},{"n":2,"q":"呼吸ECMOの歴史について正しいものはどれか。","o":["1972年にHillらが小児ARDSのECMO救命例を初めて報告した","1979年のNIH主導RCTでECMO群の生存率は約50%であった","CESAR trialではECMO群に割り付けられた全例がECMOを受けた","CESAR trialの主要評価項目は28日死亡率であった","CESAR trialは2009年に英国から報告された"],"a":4,"e":"1979年NIH RCTは両群とも生存率10%未満。CESAR（2009年英国、180例）ではECMO群の実際の施行は75%(68/90)、6カ月生存率を有意に改善（RR0.69）。Hillらの報告は24歳男性。(p5)"},{"n":3,"q":"2009年H1N1インフルエンザ流行時のECMO成績について本書の記載と合致するものはどれか。","o":["わが国のECMO生存率は約36%であった","オーストラリア・ニュージーランドの生存率は約36%であった","フランスの生存率は92%であった","わが国の成績は12カ国中で最上位であった","スウェーデンの生存率は56%であった"],"a":0,"e":"スウェーデン92%、英国70%、豪・NZ70%、イタリア68%、フランス56%に対し、わが国は36%で12カ国中最下位。これを契機にECMOプロジェクトが開始された。(p6)"},{"n":4,"q":"送血部位と血流について正しいものはどれか。","o":["動物モデルではどの血液流量でも二酸化炭素除去量は酸素供給量を約400mL/分以上上回った","動脈送血では患者心肺とECMO回路は直列になる","静脈送血では右心室に灌流する血液のすべてを脱血できる","出血・塞栓などの合併症は静脈送血のほうが動脈送血より高頻度である","静脈送血では患者心肺とECMO回路は並列になる"],"a":0,"e":"静脈送血は直列、動脈送血は並列。Sanchez-Lorenteらの動物モデルでCO2除去量はO2供給量より400mL/分以上上回った。出血・塞栓は動脈送血で高頻度。(p8-9)"},{"n":5,"q":"ELSOガイドラインにおけるECMO開始適応の目安として本書に記載されたPaO2/FIO2はどれか。","o":["300未満","200未満","150未満","100未満","60未満"],"a":3,"e":"ELSOのガイドラインではECMO開始適応はPaO2/FIO2 100未満とされる（相対的な基準）。H1N1時の報告では平均60程度であった。(p9)"},{"n":6,"q":"エベレスト登山チームで高度8,400mで計測された値として本書に記載されたものはどれか。","o":["平均PaO2 55 Torr","平均PaO2 24.6 Torr","PaCO2 40 Torr","平均SaO2 85%","base excess +6.9 mmol/L"],"a":1,"e":"平均PaO2 24.6 Torr、平均SaO2 54.0%、PaCO2 13.3 Torr、BE −6.9 mmol/L。短時間・高地順応下であればこの程度の低酸素血症にも耐えうる。(p9)"},{"n":7,"q":"大腿動脈送血のVA ECMOについて正しいものはどれか。","o":["自己肺機能が悪いと冠動脈・脳の酸素化が低下しうる","脳灌流の酸素化評価には左橈骨動脈が最も適する","VV ECMOに比べ塞栓は肺に生じやすい","送血は大動脈内を順行性に流れる","下肢虚血は起こらない"],"a":0,"e":"大腿動脈送血は逆行性で、自己肺機能が悪いと左室から拍出される血液の酸素化が悪く心臓・脳への酸素供給が低下しうる。送血部位から脳よりも離れた右橈骨動脈でのモニターやNIRSで評価する。VA ECMOでは塞栓は脳など体循環系に、下肢虚血にも注意。(p11-13)"},{"n":8,"q":"VV ECMOについて誤っているものはどれか。","o":["スウィープガスを遮断して離脱可能性を評価できる","再循環は脱血・送血カニューレが近すぎると起こりやすい","ウィーニング時ECMO血流量は1.5〜2.0 L/分程度まで下げる施設が多い","心拍出量が増加すると右心系血液に占めるECMO血の割合は上昇する","再循環が増えると脱血血の酸素飽和度が上昇する"],"a":3,"e":"一定ECMO流量下で心拍出量が増加すると、ECMO由来の血液の割合は低下する。VA ECMOではスウィープガスを遮断すべき状況はない点に注意。(p12-13)"},{"n":9,"q":"特殊な回路構成について正しいものはどれか。","o":["チューブオクルーダー装着部は血栓の好発部位とならない","V-AV ECMOは静脈から脱血し動脈のみに送血する","V-AV ECMOの2系統の血流配分はチューブオクルーダーで調整する","VV-A ECMOは送血カニューレを2本留置するVA ECMOである","A-V ECMOは十分な酸素化が得られるためoxygenationの呼称が適切である"],"a":2,"e":"V-AVは静脈から脱血し静脈と動脈の2系統に送血、配分はチューブオクルーダーで調整し超音波流量計でモニター。オクルーダー部は乱流により血栓好発部位。VV-Aは脱血カニューレ2本。A-Vはポンプレスで酸素化は不十分だがCO2除去（A-V ECCO2R）として有用性が報告。(p14-15)"},{"n":10,"q":"心臓の生理について本書の記載と合致しないものはどれか。","o":["心臓は1日約10万回収縮・弛緩を繰り返す","洞結節の膜電位時計（membrane clock）にはIfチャネルとL型・T型Caチャネルが関与する","心臓が1日に費やすATPは約6kgに及ぶ","1日に約10トンの血液を循環させる","カルシウム時計（calcium clock）の主体はIK1チャネルである"],"a":4,"e":"calcium clockには筋小胞体のNa/Ca交換機構が関与。IK1チャネルは作業心筋の膜電位を安定化させるチャネルで洞結節にはない。(p17-18)"},{"n":11,"q":"心原性ショックにVA ECMOを導入した際の血行動態変化として正しいものはどれか。","o":["前負荷は低下し後負荷は増加する","補助流量を増やしても負荷は変化しない","前負荷・後負荷とも低下する","前負荷は増加し後負荷は低下する","前負荷・後負荷とも増加する"],"a":0,"e":"静脈から脱血し動脈に送血するため右房圧低下（前負荷低下）、動脈への負荷増加（後負荷増加）となり、補助流量を増やすほど顕著となる。(p19)"},{"n":12,"q":"VA ECMOと併用する補助循環装置について正しいものはどれか。","o":["IABPはVA ECMOとの併用で後負荷を増加させる","IABPは収縮期にバルーンを拡張する","冠血流の約1/3が拡張期に流れる","Impella CPの最大補助流量は5.0 L/分である","Impellaによる左室の負荷軽減作用はIABPより強力である"],"a":4,"e":"IABPは拡張期にバルーン拡張、冠血流の2/3は拡張期。IABPはPCPSで上昇した後負荷を低下させる目的で併用される（p305）。Impellaの補助流量は2.5で2.5 L/分、CPで3.5 L/分、5.0で5.0 L/分まで（p306。なおp323ではCPを最大3.2 L/分と記載しており、本書内で数値が一致しない）。Impellaは左室から直接脱血するためIABPより強力に左室の負荷を軽減する。(p20, 305-306)"},{"n":13,"q":"ARDSについて本書の記載と合致するものはどれか。","o":["呼吸不全そのものが死亡原因になるのは約15%に過ぎない","ベルリン定義でP/F<100 mmHgは中等症とする","ベルリン定義でP/F 200〜100 mmHgは軽症とする","肺保護換気は重症例のみに必要である","現在の死亡率は10%未満である"],"a":0,"e":"300〜200軽症、200〜100中等症、<100重症。死亡率は今なお30〜40%。死因は呼吸不全そのものは15%に過ぎず多臓器不全が多い。肺保護換気は全例で必須。(p21)"},{"n":14,"q":"経肺圧（気道内圧と胸腔内圧の差）について、本書の図示例と合致するものはどれか。","o":["自発呼吸で胸腔内圧−10 cmH2O、気道内圧0のとき経肺圧は−10 cmH2O","陽圧換気では気道内圧が同じなら経肺圧は胸腔内圧に依存しない","気道内圧10 cmH2Oでも強い吸気努力で胸腔内圧−20 cmH2Oとなると経肺圧は+30 cmH2Oに達しうる","通常の胸腔内圧は+5〜+10 cmH2Oである","胸水で胸腔内圧+22 cmH2O、気道内圧30 cmH2Oのとき経肺圧は+52 cmH2O"],"a":2,"e":"Ptp=Paw−Ppl。胸水例は30−22=+8、自発呼吸は0−(−10)=+10。通常の胸腔内圧は−5〜−10 cmH2O。強い吸気努力下では人工呼吸器設定が低くても肺傷害の可能性がある。(p23-24)"},{"n":15,"q":"人工呼吸器関連肺傷害の概念について誤っているものはどれか。","o":["biotraumaは肺局所に留まり全身臓器には影響しない","atelec-traumaでは虚脱と再膨張を繰り返す部位にずり応力（shear stress）が生じる","ARDS Networkの研究では6 mL/kg群と12 mL/kg群が比較された","一回換気量の大きさが肺傷害を決めるという概念をvolu-traumaと呼ぶ","atelec-traumaの予防には閉塞圧（closing pressure）以上のPEEP設定が重要である"],"a":0,"e":"biotraumaでは炎症性サイトカインが全身に波及し、直接傷害を受けていない肺以外の臓器にも多臓器不全を生じうる。(p23-24)"},{"n":16,"q":"\"baby lung\"概念と駆動圧について正しいものはどれか。","o":["肺の含気率と静的コンプライアンスは相関しない","約3,500名の再解析で予後を決定するのはPEEPの高さであった","ARDSでは含気のある正常に近い肺領域が縮小している","駆動圧が低いほど予後は悪い","ARDS肺は「硬い」肺と理解すべきである"],"a":2,"e":"ARDS肺は「硬い」より「小さい」（baby lung）と理解すべきで、含気率とコンプライアンスは直線的に相関。約3,500名の再解析で予後を決定するのは駆動圧（プラトー圧−PEEP）で、高いほど予後不良。(p24-25)"},{"n":17,"q":"重症ARDS 340例を対象に、筋弛緩薬を最初の48時間使用した群と非使用群を比較した多施設研究の結果として本書に記載されたものはどれか。","o":["筋弛緩薬群で離脱困難が有意に増加し予後不良","28日生存率で対照群が良好","90日生存率は筋弛緩薬群69.4%、対照群59.3%で筋弛緩薬群が有意に良好","筋弛緩薬群で人工呼吸器関連肺炎が増加","両群に差はなかった"],"a":2,"e":"90日目生存率は筋弛緩薬群69.4% vs 対照群59.3%。自発呼吸を抑制し人工呼吸器との不同調改善・肺への過大なストレス予防による可能性が考察されている。(p26)"},{"n":18,"q":"自発呼吸と健常肺の肺保護換気について正しいものはどれか。","o":["健康成人の全身麻酔中、コンプライアンスはPEEP 20 cmH2Oで最大値を示した","自発呼吸が原因で肺損傷を生じる場合をP-SILIと呼ぶ","食道内圧で推定される経肺圧は胸郭の全領域の経肺圧を正確に代表する","iPROVE studyでは個別化PEEP設定により術後合併症が有意に減少した","PROVHILO trialでは高PEEP群で術後呼吸器合併症が有意に減少した"],"a":1,"e":"食道内圧は胸郭中央の経肺圧を代表し、無気肺の多い部分では異なる。全身麻酔中はPEEP 10 cmH2Oで最大コンプライアンス。PROVHILO（900例、PEEP<2 vs 12）・iPROVE（2018年、1,000名超）とも術後合併症の発生率は改善しなかった。(p26-28)"},{"n":19,"q":"SARS-CoV-2とACE2について本書の記載と合致しないものはどれか。","o":["SARS-CoV-2はSARS-CoVと遺伝子的に79.5%の共通点がある","呼吸器系でACE2の発現が多いのは2型肺胞上皮細胞である","ACE2はAng-IIをangiotensin-(1-7)へ変換する","宿主への侵入にACE2をレセプターとして用いる","ACE2はRASの正の作用（血管収縮・炎症）を増強する"],"a":4,"e":"ACE2/angiotensin-(1-7)/MAS系はRASの負の作用を拮抗し抗炎症作用を担う。感染でACE2がダウンレギュレートされバランスが崩れる。(p31-33)"},{"n":20,"q":"GattinoniらのCOVID-19フェノタイプ（type L/H）について正しいものはどれか。","o":["食道内圧の振れ幅が15 cmH2Oを超えても非侵襲的管理を継続すべきとされる","type LではPEEPを15 cmH2O以上に設定する","type Lでは肺リクルートメントの可能性が高い","type Lは高エラスタンスである","type Hは右左シャント増加・高肺重量を特徴とする"],"a":4,"e":"type Lは低エラスタンス・低V/Q・低肺重量・リクルートメント可能性が低い。type Hは高エラスタンス・右左シャント増加・高肺重量・リクルートメント可能性高。食道内圧の振れ>15 cmH2OはP-SILIの可能性が高くできる限り速やかに気管挿管が必要。type LではPEEPを10 cmH2O以下に設定する。(p35-36)"},{"n":21,"q":"本書に記載されたECMO血流量（体重あたり）の目安の組み合わせで正しいものはどれか。","o":["小児 100〜150 mL/kg/分","成人 60〜80 mL/kg/分","乳児 30〜50 mL/kg/分","成人 100〜150 mL/kg/分","乳児 60〜80 mL/kg/分"],"a":1,"e":"酸素供給量の目安（乳児6、小児4〜5、成人3 mL/kg/分）をECMO血流に換算すると乳児100〜150、小児80〜120、成人60〜80 mL/kg/分。(p38)"},{"n":22,"q":"遠心ポンプの管理について正しいものはどれか。","o":["1日以上のポンプ交換は不要である","インレット側に過度の陰圧がかかると気泡が発生しうる","CentriMag Systemは軸受けを有する","回転数と血流量は常に比例する","鉗子操作はインレット（脱血）側で行うのが安全である"],"a":1,"e":"回転数と流量は比例せず前後負荷で変化する。インレット側を鉗子で締めると過度の陰圧で気泡発生（微小気泡は人工肺を通過しうる）するため、鉗子操作は陽圧側のアウトレット側で行う。CentriMagは磁気浮上型で軸受けがなく血栓リスクが低い。(p38-39)"},{"n":23,"q":"人工肺のガス交換膜について正しいものはどれか。","o":["多孔質膜は血漿漏出が起きないため長期使用に推奨される","非対称膜（PMP）は表面に極薄の緻密層を形成し長期耐久性に優れる","均質膜の代表はポリメチルペンテン（PMP）である","均質膜を用いた人工肺が現在主流である","わが国で人工肺の添付文書上の使用時間は30日である"],"a":1,"e":"均質膜はシリコン膜で現在は市販されていない。多孔質膜は血漿漏出のため長期ECMOには推奨されない。添付文書の使用時間は6時間（実臨床は1〜2週間使用）。(p39-40)"},{"n":24,"q":"人工肺のウェットラングの機序として正しいものはどれか。","o":["酸素濃度の上昇で膜が劣化する","血液相の陰圧で空気が混入する","血漿成分がガス相に漏出する","ガス相の水蒸気が室温の酸素で冷却され結露する","血栓が中空糸を閉塞する"],"a":3,"e":"ガス配管からの酸素は湿度ほぼ0%・室温。血液相から微細孔を通して水蒸気が発生し、温度差によって結露した水がホローファイバー内に貯留してガス交換を妨げる。(p41)"},{"n":25,"q":"人工肺トラブルとカニューレについて誤っているものはどれか。","o":["SARS-CoV-2感染例ではプラズマリーク発生前の回路交換が推奨されている","プラズマリークはガス排出部から黄色い泡状の液体が漏出することで発見できる","ウェットラングにはO2フラッシュ（一時的なガス流量増加）で対応する","国内の脱血カニューレの多くはmulti-stagedで近位側サイドホール優位に脱血される","カニューレの抵抗は長さに比例し内径の2乗に反比例する"],"a":4,"e":"カニューレ抵抗は長さに比例し、内径の4乗に反比例するため内径が血流量を決める最重要因子。COVID-19ではプラズマリークでウイルスがエアロゾルとして排出されるリスクがある。(p42-43)"},{"n":26,"q":"ECMOが全身に送る酸素供給量（DO2(ECMO)）の簡易算出式として本書に記載されたものはどれか（Q：ECMO流量、cSvO2：脱血管の酸素飽和度）。","o":["0.003×Q×PaO2","1.34×Hb×(1−cSvO2)","1.34×Q×Hb×cSvO2","1.34×Q×Hb×(1−cSvO2)","Q×Hb×(SaO2−SvO2)"],"a":3,"e":"DO2(ECMO)=1.34×Q×Hb×(1−cSvO2)。最大化には流量を十分確保することが重要で、VV ECMOでは脱血管の選択が成功の鍵となる。(p43)"},{"n":27,"q":"ダブルルーメンカニューレ（Avalon Elite）について本書の記載と合致しないものはどれか。","o":["右内頸静脈1カ所のアクセスでVV ECMOが可能である","透視下や経食道心エコー下での留置が前提である","わが国では2019年に認可された","両足が自由となりリハビリテーションに有効とされる","高流量が必要な場合でも細径（19 Fr程度）で十分である"],"a":4,"e":"構造上27あるいは31 Frの太径を選択せざるを得ず、挿入時の血管損傷や右室穿孔などの合併症が報告されている。(p46, 48)"},{"n":28,"q":"超音波で測定した血管径が7 mmのとき、本書に記載されたカニューレサイズ決定式に基づく推奨サイズとして最も適切なものはどれか。","o":["14〜16 Fr","18〜20 Fr","21〜23 Fr","24〜26 Fr","27〜29 Fr"],"a":1,"e":"カニューレサイズ(Fr)＝{血管径(mm)×3}−1〜3(Fr)。7×3=21 Frから1〜3 Frを引き18〜20 Fr。(p49)"},{"n":29,"q":"成人VV ECMOのカニューレ穿刺部位について本書の記載と合致するものはどれか。","o":["ダブルルーメンカニューレの穿刺部は原則として左内頸静脈である","IVC脱血では「rIJV→FV」が一般的である","頸部感染例では「FV→FV」が選択されるが、IVCに太径カニューレが2本留置され脱血不良が生じやすい","SVC脱血ではリサーキュレーションが減少する","大腿静脈穿刺では左大腿静脈を第一選択とする"],"a":2,"e":"IVC脱血は「FV→rIJV」が一般的。IVCと総腸骨静脈の分岐部は右側で屈曲が小さく、左は右総腸骨動脈との交差部で圧迫されるためrFVを第一選択。SVC脱血は解剖学的にリサーキュレーションが増大。ダブルルーメンは原則rIJV。(p51-53)"},{"n":30,"q":"成人のperipheral VA ECMO（F-F bypass）について正しいものはどれか。","o":["mixing zoneの位置は自己心拍出量によって変化する","mixing zoneが左内頸動脈より近位側にあれば脳血流は自己心由来となる","肺酸素化能が低下しても上半身の酸素化は影響を受けない","ECMO flowは大動脈内を順行性に流れる","内頸動脈への送血は成人で一般的に選択される"],"a":0,"e":"F-F bypassではECMO flowは逆行性。mixing zoneが左IJAより近位側にあれば脳血流はECMO flowで担保、遠位側なら自己心由来となり、肺酸素化能低下例では問題となる。内頸動脈送血は脳損傷と関連するため成人では選択されない。(p53)"},{"n":31,"q":"成人VA ECMO/ECPRのカニュレーションについて誤っているものはどれか。","o":["脳血流の酸素化低下はdifferential hypoxemia（Harlequin syndrome）と呼ばれる","ECPRの合併症率低下にhybrid emergency roomやportable C-armが望ましい","予防的distal perfusion cannula留置は全例で強く推奨されている","ECPRでは胸骨圧迫と作業導線が交わらないF-F bypassの選択が一般的である","peripheral ECMOはcentral ECMOに比べ局所感染率の低下・30日生存率の改善が指摘されている"],"a":2,"e":"下肢虚血は単独で死亡率を上昇させ、DPC留置で回避できるが、予防的DPC留置は推奨されているわけではなく留意すべきとされる。(p54-55)"},{"n":32,"q":"新生児・小児のECMOカニュレーションについて正しいものはどれか。","o":["低体重児で1.6 kg未満のECMOでは生存率40%以下との報告がある","15 kg以上では頸部アプローチが必須である","小児では大腿動脈・静脈の径が総頸動脈・内頸静脈より太い","新生児VA ECMOでは送血管を内頸静脈に挿入する","大腿動脈カニュレーション時の遠位灌流障害の発生率は小児で成人より低い"],"a":0,"e":"小児では総頸動脈・内頸静脈のほうが大腿動脈より太い。遠位灌流障害は成人10%に対し小児29〜54%。新生児VAは脱血管を内頸静脈、送血管を総頸動脈。15 kg以上では大腿部動脈アプローチを選択する施設もある。(p57)"},{"n":33,"q":"小児ECMOの流量・回路圧について本書の記載と合致しないものはどれか。","o":["Texas Children's Hospitalでは脱血圧−70 mmHg程度を許容下限としている","頸部動脈アプローチ後は結紮群のほうが血管再建群より神経学的予後が良好であった","ハーゲン・ポアズイユの式では流量はカニューレ半径の4乗に比例する","10 kg以上では体表面積を加味し2.4〜3 L/m²/分が目安である","10 kg以下のfull supportに必要な流量は0.15 L/kg/分が目安である"],"a":1,"e":"結紮群が血管再建群より5年後の神経学的予後が有意に悪かったとの報告があり、可能な限り血管再建を行うべきとされる。送血側outlet pressureは＋250 mmHg程度を許容上限。(p58-59)"},{"n":34,"q":"本書の表に示された成人VV ECMO（respiratory ECMO）の管理目標として正しいものはどれか。","o":["SvO2 90%以上","PaO2 45〜80 mmHg、SaO2 80〜95%","PaO2 80〜150 mmHg","目標SpO2 95%以上","血液流量 30〜40 mL/kg/分"],"a":1,"e":"VV ECMOは60〜80 mL/kg/分（50 kgなら3,000〜4,000 mL/分）、SaO2 80〜95%、PaO2 45〜80 mmHgを維持。VA ECMOはPaO2 80〜150 mmHg、SpO2 95%以上、SvO2 60〜70%以上が指標。(p61)"},{"n":35,"q":"スウィープガスの管理について正しいものはどれか。","o":["VA ECMO施行中は送血圧が高いため気泡混入のリスクはない","酸素付加は送気ガス流量に依存し、CO2排出はF IO2に依存する","定期的ガスフラッシュは10 L/分、10秒程度で行う","ガスフラッシュ時は気体側圧力＞血液側圧力とすべきである","スウィープガスは通常、血液流量：ガス流量＝1：3で用いる"],"a":2,"e":"酸素付加は送気ガスのFIO2に、CO2排出は送気ガス流量に依存。通常血液流量：ガス流量＝1：1。気体側圧力＞血液側圧力にしないこと（気泡混入の原因）。補助循環離脱時の低送血圧では気体側圧力が上回る可能性がある。(p62)"},{"n":36,"q":"VV ECMO中の酸素化・換気目標として本書に記載されたものはどれか。","o":["SaO2 100%、PaCO2 40 mmHg固定","SaO2 95%以上、PaCO2 25〜30 mmHg","SaO2 90%以上、PaCO2 45〜55 mmHg","心拍出量やHbが維持されていればSaO2 80%前後でも許容、PaCO2 35〜45 mmHg","SaO2 70%前後、PaCO2制限なし"],"a":3,"e":"VV ECMO中の酸素化の多くは血液流量が規定し、成人で60〜80 mL/kg/分。心拍出量・Hbが維持されていればSaO2 80%前後でも許容、PaCO2 35〜45 mmHgを目標に血流量・スウィープガス流量を調節。(p62)"},{"n":37,"q":"VA ECMO中の循環動態指標について誤っているものはどれか。","o":["ETCO2は自己心の回復に伴い肺血流が増加すると上昇する","酸素化評価のための血液ガスは右上肢から採取する","ACS症例でIABP挿入時はaugmentation圧60 mmHg以上を目標とする","ECPR導入時、自己心拍がない状況では60 mL/kg/分以上の最大流量で補助する","安静時のDO2はVO2の4〜5倍で、5：1のときSvO2は75%前後となる"],"a":2,"e":"ACSでIABP併用時はaugmentation圧90 mmHg以上、平均血圧60 mmHgを目標とする。(p63-64)"},{"n":38,"q":"未分画ヘパリン（UFH）について正しいものはどれか。","o":["カニュレーション時は200〜300 U/kgをボーラス投与する","血中半減期は約6時間である","UFHはATによるトロンビン・Xa因子の不活化を約1,000倍以上に促進する","持続投与は50〜100 U/kg/時で開始する","主に腎臓で代謝される"],"a":2,"e":"UFHは肝臓で代謝・腎排泄、半減期30〜60分、プロタミンで中和。カニュレーション時50〜100 U/kgボーラス、持続10〜20 U/kg/時で開始。(p65)"},{"n":39,"q":"ナファモスタットメシル酸塩（NM）について本書の記載と合致しないものはどれか。","o":["ECMO中の副作用として特に高カリウム血症が報告されている","1986年にわが国で合成された","腎集合管アミロライド依存性Na+チャネル抑制により高カリウム血症を生じる","Limらの320名の後ろ向き分析でNMはUFHより出血リスクが有意に低かった","87名の臨床研究で出血合併症率はUFH群72.7%、NM群38.2%であった"],"a":3,"e":"Limらは320名の分析でUFHよりNM使用が出血リスクを高めると報告しており、さらなるRCTを含めた検討が必要とされる。(p65-67)"},{"n":40,"q":"わが国で使用可能な直接トロンビン阻害薬アルガトロバンについて正しいものはどれか。","o":["半減期は約3時間である","AT非依存性に作用し、血栓に結合したトロンビンも阻害する","HITに対する開始投与量は2.0 μg/kg/分である","腎臓で代謝される","拮抗薬としてプロタミンがある"],"a":1,"e":"分子量527 Da、半減期約30分、肝代謝（肝機能障害で減量）、拮抗薬なし。HITでは0.7 μg/kg/分（肝機能障害時0.2）で開始し、APTTを基準値の1.5〜3.0倍（100秒以下）に調節。(p67-68)"},{"n":41,"q":"4T'sスコアについて本書の記載と合致するものはどれか。","o":["血小板減少が30%未満の低下は2点である","0〜3点ではHITである確率は5%未満とされる","ヘパリン投与5〜10日での明確な発症は0点である","6〜8点は中等度確率である","4項目の合計は0〜12点である"],"a":1,"e":"合計0〜8点（6〜8高、4〜5中、0〜3低）。0〜3点でHITの確率は5%未満、6〜8点で80%以上。50%超の低下が2点、5〜10日の明確な発症が2点。(p68)"},{"n":42,"q":"わが国の免疫学的HIT抗体検査について正しいものはどれか。","o":["ラテックス凝集法は陰性的中率が低い","化学発光免疫測定法は4.0 U/mL以上で陽性率が高い","洗浄血小板マイクロパーティクル放出量検査は多くの施設で実施可能である","機能的検査は免疫学的検査より精度が低い","EIA法は保険適用である"],"a":1,"e":"ラテックス凝集・化学発光免疫測定は保険適用・陰性的中率が高く、4.0 U/mL以上で陽性率が高い。EIAは保険適用外（吸光度2.0以上で陽性率高）。機能的検査は精度が高い。マイクロパーティクル検査は国立循環器病研究センターのみ（2021年1月現在測定不可）。(p68-69)"},{"n":43,"q":"ECMO中の抗凝固モニタリングについて誤っているものはどれか。","o":["Anti-XaはUFH濃度を直接測定する検査である","UFH使用時の目標ACTは180〜220秒と定義されている","Niebler らはACTからAnti-Xa管理への変更で脳出血・輸血量の減少などを報告した","ACTは全血の検査であり血小板数やフィブリノゲン値などの影響を受ける","成人症例ではAPTT基準値の1.5〜2.5倍がUFH濃度0.2〜0.4 U/mLに相関する"],"a":0,"e":"Anti-XaはUFH濃度を直接測定するのではなく、UFHとATの結合によりXa因子の抑制作用をもとにUFHの効果を測定する。ELSO調査ではAnti-Xa目標値は成人・小児とも0.3〜0.7 U/mL。(p69-71)"},{"n":44,"q":"TEGについて本書の記載と合致するものはどれか。","o":["CKHはヘパリナーゼを加えヘパリンの影響を評価する","R時間は血餅の最大強度を表す","LY30はMAから60分後の血餅減少率である","Rileyらの研究で術後8時間の非出血を最も予測するのはCKH-MA 30 mm以下であった","MAは約80%がフィブリン、20%が血小板の寄与による"],"a":0,"e":"R=凝固時間（凝固因子）、MA=最大血餅強度（20%フィブリン、80%血小板）、LY30はMAから30分後の血餅減少率。RileyらはCKH-MA 50 mm（AUC0.77）以上をカットオフと報告。(p72-73)"},{"n":45,"q":"Panigadaらによる、APTTとTEG（CK-R）を用いたECMO抗凝固法の比較研究の結果として本書に記載されたものはどれか。","o":["血栓症はTEG群で有意に多かった","Fbg産生はTEG群で抑制された","TEG群で未分画ヘパリン使用量が多かった","フラットライン発生率はTEG群で有意に高かった","手術部位の出血はAPTT群28.6% vs TEG群0%であった"],"a":4,"e":"UFH使用量はAPTT群15.7 vs TEG群11.7 U/kg/時、フラットラインはAPTT群52% vs TEG群34%と有意に低値。手術部位出血はAPTT群28.6% vs TEG群0%、血栓症は同等。(p74)"},{"n":46,"q":"ECMO回路内圧モニタリングについて正しいものはどれか。","o":["ELSOガイドラインでは回路内圧の測定は推奨されていない","圧力トランスデューサの高さは測定値に影響しない","人工肺出口圧は脱血カニューレの状況を反映する","人工肺の入口と出口の差圧は人工肺の抵抗を表し、血栓形成の発見に有用である","遠心ポンプ入口圧は主に人工肺の抵抗を表す"],"a":3,"e":"ポンプ入口圧は静脈圧・脱血カニューレ・脱血回路抵抗、人工肺入口圧は人工肺抵抗、人工肺出口圧は動脈圧・送血側の状況を反映。水柱圧の影響に注意が必要。ELSOは人工肺入口・出口、脱血回路での測定を推奨。(p77)"},{"n":47,"q":"血流量一定の条件下で、遠心ポンプ入口圧・人工肺入口圧・人工肺出口圧に変化がなく、人工肺吹送ガス入口圧のみが低下した。最も考えられるトラブルはどれか。","o":["吹送ガス流し忘れ","人工肺の詰まり","人工肺血漿リーク","脱血カニューレの先当たり","送血カニューレの先当たり"],"a":0,"e":"脱血側トラブルはポンプ入口圧↓、送血側は人工肺入口・出口圧↑、人工肺の詰まりは人工肺入口圧のみ↑（差圧↑）、血漿リーク・ガスフラッシュ継続はガス入口圧↑、吹送ガス流し忘れはガス入口圧↓。(p79)"},{"n":48,"q":"人工肺のプライミングについて正しいものはどれか。","o":["ほとんどの回路はプライミング時に人工肺が最初に満たされるよう設計されている","回路が満たされる前に遠心ポンプを回転させると気泡抜きが早い","大まかな気泡除去後は遠心ポンプを低回転のみで循環させる","酸素ラインは人工肺のガス出口に接続する","人工肺は一番高い位置になるよう工夫されている"],"a":4,"e":"回路を満たす前のポンプ回転は空回りし気泡抜きに時間がかかる。人工肺が最後に満たされるよう一番高い位置に。細かな気泡は高回転・低回転を繰り返して除去。酸素ラインは人工肺のガス入口へ。(p81)"},{"n":49,"q":"プライミングと鉗子について本書の記載と合致しないものはどれか。","o":["酢酸がバッファーの輸液は血圧低下の危険がある","清潔にプライミングできていれば2〜3日使用可能とされる","10 mmのチューブには小鉗子を用いると確実にクランプできる","高回転で待機するとプライミング液の温度上昇が危惧される","小児用回路のプライミング量は約300 mL、成人用は約600 mL程度である"],"a":2,"e":"10 mmチューブに小鉗子では確実にクランプできない、または鉗子がはじける可能性がある。鉗子は真ん中で回路に垂直にクランプ、3段階のロックを最後まで。(p82-83)"},{"n":50,"q":"人工肺のガス交換能低下の原因のうち、回路交換が不要とされるものはどれか。","o":["ウエットラング","外装破損","人工肺の詰まりによる差圧上昇","プラズマリーク","血栓形成"],"a":0,"e":"ウエットラングは酸素フラッシュ（10 L/分、10秒）・送気ガス加温で対応可能で交換不要。人為的ミス（酸素供給不足）や生体由来（酸素解離曲線右方偏位、全身酸素代謝ミスマッチ）も交換不要。(p84-85)"},{"n":51,"q":"ECMO/PCPS管理中の不整脈について本書の記載と合致しないものはどれか。","o":["QT延長症候群は遅延後脱分極（DAD）による撃発活動の代表的基礎疾患である","致死的不整脈に対して交感神経緊張は促進的に作用する","心不全状態ではCaイオンリークによる遅延後脱分極（DAD）から撃発活動が生じやすい","torsade de pointesではQT延長があればマグネシウムの静注が有効である","器質的疾患を伴う持続性VTは背景に重篤な基礎心疾患を有し予後不良であることが多い"],"a":0,"e":"QT延長症候群は早期後脱分極（EAD）による撃発活動の基礎疾患。DADは心筋虚血・急性心不全・カテコラミン過剰・ジギタリス中毒など。(p96-97)"},{"n":52,"q":"右心不全の診断基準として本書の表に記載されたものはどれか。","o":["RVSWI>10","TAPSE≧20 mm","CVP/PCWP>0.63","CVP/PCWP<0.3","PAPi>2.0"],"a":2,"e":"PAPi<0.9、RVSWI<4、CVP/PCWP>0.63、TAPSE≦14 mm。PAPi=(sPAP−dPAP)/RAP。(p97)"},{"n":53,"q":"ECMO回路への鎮静・鎮痛薬の吸着について本書の記載と合致するものはどれか。","o":["ECMO中の最適な鎮痛薬としてフェンタニルが推奨される","モルヒネは親油性が高く回路への吸着が著しい","Shekarらの研究で24時間後の平均回収率はミダゾラム13%、フェンタニル3%であった","一般に脂溶性が高い（logP>2）薬物ほど回路に吸着されにくい","デクスメデトミジンは回路への吸着が起きにくい"],"a":2,"e":"logP>2の薬物はECMO回路に吸着しやすい。モルヒネ（logP 0.9）は吸着が起きにくく、ECMO中の鎮痛薬としてフェンタニルの代替薬として推奨。ミダゾラム・プロポフォール・デクスメデトミジン・フェンタニルは吸着が著しい。(p110-111)"},{"n":54,"q":"ECMO中の抗菌薬投与について正しいものはどれか。","o":["Parkらの研究で従来の間欠的投与法の治療域達成率は約80%であった","バンコマイシンの初回ローディングは避けるべきである","βラクタム系は血中濃度がMICを上回った時間（time above MIC）が短いほど効果が高い","セフトリアキソンはタンパク結合率が低く回路への吸着はほとんどない","成人ECMO患者のバンコマイシンのVd・CLは非ECMO ICU患者と比較して有意差がなかった"],"a":4,"e":"βラクタムはtime above MICが長いほど効果が高く持続投与が推奨。CTRXはタンパク結合率が高く回路吸着の可能性。Parkらの研究では間欠投与で治療域達成率5%。20〜30 mg/kgの初回ローディングは理にかなうとされる。(p111, 124)"},{"n":55,"q":"VA ECMOカニューレ抜去について本書の記載と合致しないものはどれか。","o":["外科的修復時はまず中枢側血管を確保する","可能な限りヘパリンを抜去の1時間ほど前に中止しておくことが望ましい","静脈壁には必ずpurse string sutureをかける必要がある","血栓除去にはFogartyカテーテル（3-4-5 Fr）を用いる","静脈カニューレ抜去は空気の引き込みを避けるため呼吸停止下に行うことが望ましい"],"a":2,"e":"静脈壁へのpurse string sutureは必ずしも必要ない。かけないほうが静脈を狭窄させてしまうリスクが低下する。抜去後はプロタミンでヘパリンを完全に中和。(p134-135)"},{"n":56,"q":"ECMO装着中の看護管理について本書の記載と合致するものはどれか。","o":["採尿バッグは常に膀胱レベルよりも低い位置で維持し床に触れないようにする","冷温水槽で送血温度を一定に保つため感染症で発熱しやすい","踵はクッションで圧迫して固定する","PICCはCVCと比べて感染率は高いとされる","回路を移動させる体位変換は1名で行う"],"a":0,"e":"冷温水槽使用中は感染しても発熱で発見されにくい。体位変換は2名以上。PICCはCVCより感染率は低いとされる。踵はスモールクッションなどで完全に浮かせて除圧。(p150-151)"},{"n":57,"q":"PCPS研究会のアンケート調査（2013〜2015年）について本書の記載と合致するものはどれか。","o":["使用目的は開心術後心不全が最多であった","6割近くの施設が年間20例以上であった","診療科別では救命救急が最多であった","568施設中215施設から回答があり回答率は37.9%であった","PCPS導入後の離脱とVAD移行を足した割合は約70%で推移した"],"a":3,"e":"診療科別は循環器内科42%、救命救急31%、心臓血管外科24%。使用目的は急性心不全43%、救命領域31%、開心術後13%。離脱とVAD移行は43〜45%。6割近くの施設は年間10例以下。(p171)"},{"n":58,"q":"ECMOにおける緩和ケア・倫理について本書の記載と合致しないものはどれか。","o":["開心術後の離脱困難例や心停止に対するECPRは\"Bridge to Decision\"に含まれる","ELSOデータベースでは2002〜2012年に家族の要請でECMO治療を終了した例は223例（14.1%）であった","米国ではwithholdingとwithdrawalは法的・倫理的に同等と捉えられている","移植・VADへの見通しが不明なままECMOを開始し経過をみる場合を\"Bridge to Decision\"という","ハーバード大学の調査で、VADの非稼働を安楽死や自殺幇助と混同する医師は存在しなかった"],"a":4,"e":"心不全内科医でさえ安楽死や自殺幇助と混同する医師が13%、他の延命治療とは違うと感じる医師が30〜40%いることが示されている。(p184-185)"},{"n":59,"q":"蘇生とECPRの歴史年表（本書）について正しい組み合わせはどれか。","o":["1976年 ― 伊藤らがOHCAに対するECPRを開始","2014年 ― 日本蘇生協議会（JRC）発足","1988年 ― Mattoxが人工心肺を用いた蘇生を報告","1953年 ― Gibonが人工心肺装置を用い心房中隔欠損に対する手術に成功","2002年 ― SAVE-J studyが発表"],"a":3,"e":"1976年Mattox、1988年伊藤らのOHCAに対するECPR開始、2002年JRC発足、2014年SAVE-J study発表。1983年にPhilipsがthin wall cannulaを使用したECPRの5症例を報告。(p195)"},{"n":60,"q":"国際的な蘇生組織の歴史について正しいものはどれか。","o":["1996年にInternational Liaison Committee on CPRがILCORに改名された","日本救急医学会が「救急蘇生法の指針」を1983年に初めて刊行した","JRCは2002年にILCOR発足時の最初の加盟団体となった","ILCORのガイドライン作成ではエキスパートの意見が最優先とされた","ILCORは1992年に国際蘇生連絡委員会として発足した"],"a":0,"e":"1992年にInternational Liaison Committee on CPR設立、1996年ILCORに改名。「救急蘇生法の指針」は1978年日本救急医学会編、1983年日本医師会編。ILCORは2000年版でevidence-based processを採用。JRCは2006年にRCAとしてILCORに加入。(p194-195)"},{"n":61,"q":"ECPRの定義と胸骨圧迫の生理について本書の記載と合致しないものはどれか。","o":["ECPRは開胸をせず経皮的に人工心肺装置を駆動させる心肺脳蘇生法と定義される","欧米ではVA ECMOまたはECLSと呼ぶ","ECPRの血流は拍動流で冠循環を維持する","ECPR駆動早期には冠動脈・脳循環を80%以上保持する","胸骨圧迫で捻出される心拍出量は安静時心拍出量の最大でも約30%である"],"a":2,"e":"ECPRの血流は大動脈内を逆行性に流れる非拍動性の定常流で、冠動脈・脳循環を80%以上保持する。(p202-203)"},{"n":62,"q":"SAVE-J studyについて本書の記載と合致するものはどれか。","o":["無作為化比較試験である","病院到着まで45分以内が適格基準である","対象は初回心電図がPEAまたは心静止の症例である","低体温療法は両群とも実施されなかった","1カ月後の神経学的予後良好例はECPR群12.3% vs 非ECPR群1.5%であった"],"a":4,"e":"prospective, non-randomized cohort study（46病院）。対象はVFまたは無脈性VT、到着時心停止、119番通報から45分以内に到着し、到着後15分間ROSCなし。両群とも32〜34℃の低体温療法を組み入れ。6カ月後も11.2% vs 2.6%。(p204)"},{"n":63,"q":"2019 ILCOR CoSTRにおけるECPRの推奨について正しいものはどれか。","o":["推奨の強さは「強い推奨、中等度のエビデンス」である","すべての心停止症例を対象に推奨された","「一定の基準を満たした症例に対し、従来のCPRが奏効しない場合に行う補助治療として推奨する」とされた","成人OHCAについて複数のRCTが採用された","ECPRの費用対効果は確立しているとされた"],"a":2,"e":"無作為化臨床研究はなく（OHCA 15編はいずれも観察研究）、弱い推奨・非常に質の低いエビデンス。費用対効果は今後の課題とされている。(p209-210)"},{"n":64,"q":"2020 ERC Guidelines（DRAFT版）でECPRの適応として具体的に記載されたものに含まれないものはどれか。","o":["バイスタンダーCPRが実施された目撃のある心停止","CPR開始からECPRを立ち上げるまでの時間が60分以内","独立した生活への復帰を妨げる重大な併存症がない若年者（65〜70歳未満など）","心停止の原因が治療可能であるか可能と推測される","初期心電図波形が心静止であること"],"a":4,"e":"2020 ERCでは①〜④（a〜d）が具体的に記載されている。(p210)"},{"n":65,"q":"ECPRの適応に関する本書の記載と合致しないものはどれか。","o":["SAVE-Jの除外規準には深部体温32℃未満の例が含まれる","SAVE-Jの除外規準には年齢20歳未満または75歳以上が含まれる","Chenらは心停止から60分以内のECPR駆動で転帰が改善したと報告した","All Japan Utstein Registryの解析では、標準的CPRは最低でも40分以上、最大60分未満継続すべきとされた","Yannopoulosらは心停止発生から心臓カテ室到着まで30分未満をECPR開始規準の1つとしている"],"a":0,"e":"SAVE-Jの除外規準は深部体温30℃未満。他に発症前ADL不良、非心原性、代諾者同意なし等。(p211)"},{"n":66,"q":"OHCA患者に関する病院収容時の転帰不良の予測因子として本書の表に記載されていないものはどれか。","o":["血漿アンモニア値>64 μmol/L","血中乳酸値>7.0 mmol/L","年齢>75歳","局所脳酸素飽和度（rSO2）<62%","血液ガス分析pH<7.2"],"a":2,"e":"表では年齢>85歳。他に心停止の目撃なし、初期調律が非電気ショック適応、bystander CPRなし、心停止からROSCまで30分以上、経過中ROSCなし、末期腎不全、非心原性。(p212)"},{"n":67,"q":"OHCAに対するECPRの臨床研究（本書の表）について正しいものはどれか。","o":["Le Guenら（2011、フランス）の心停止〜ECLS導入時間は約60分であった","Choiら（2016、韓国）の神経学的転帰良好率は29%であった","全10件の観察研究がある","無作為化比較試験が3件含まれる","最も症例数が多いのはSakamotoら（2014）である"],"a":2,"e":"日本・韓国・フランス・ドイツからの10件の観察研究で、無作為化比較試験は0件。最多はChoiら320例（神経学的転帰良好9%）。Le Guenらは120分・良好4%。(p213)"},{"n":68,"q":"ECPRの合併症（Chengらのメタアナリシス）で最も頻度が高かったものはどれか。","o":["重症感染症","主要出血","急性腎障害","下肢虚血","開胸術を要する出血"],"a":2,"e":"急性腎障害55.6%、腎代替療法46.0%、開胸術41.9%、主要出血40.8%、重症感染症30.4%、下肢虚血16.9%、コンパートメント症候群10.3%、下肢切断4.7%。(p218)"},{"n":69,"q":"ECPR導入時の合併症について本書の記載と合致するものはどれか。","o":["VA ECMO中の下肢虚血は自覚症状で容易に診断できる","TanakaらはVA ECMO導入時に約50%で外科的修復を要する血管合併症が発生したと報告した","血管合併症の有無で生存率に差はなかった","下肢虚血のリスクは12 Fr程度のカニューレ使用で高い","Yeoらの研究では虚血確認後に浅大腿動脈へ再灌流を行った群で10%に虚血が進行した"],"a":4,"e":"Tanakaらは20%で外科的修復が必要な血管合併症、合併症の有無で生存率に違いあり。20 Fr以上の大きなカニューレや若年でリスク。深鎮静下では自覚症状の聴取は困難。(p218-219)"},{"n":70,"q":"VA ECMO中の下肢虚血評価とシース挿入について本書の記載と合致するものはどれか。","o":["NIRSは前額部の左右にのみ装着可能である","Wongらは絶対値が60以下を下肢虚血の指標として提唱した","下肢の再灌流を早期に行っても救肢できない例は存在しない","下肢のNIRS値が25%以上の左右差または絶対値40以下の例では速やかに浅大腿動脈へのシース挿入を行っている","Wongらは前値から10%の低下を下肢虚血の指標とした"],"a":3,"e":"NIRSは前額部の左右と両下肢に装着可能。Wongらは絶対値40以下または前値から25%の低下を下肢虚血として提唱。下肢虚血が進行してからの再灌流では救肢できない可能性もある。(p220-221)"},{"n":71,"q":"2018年のわが国の救急搬送心肺機能停止傷病者のデータ（令和元年版救急救助の現況）について本書の記載と合致するものはどれか。","o":["除細動が実施された傷病者は心停止傷病者の約30%であった","初期心電図VF/無脈性VTの1カ月後生存率は13.9%であった","搬送された心肺機能停止傷病者は約12万7千人で1カ月後生存者は6.8%であった","救急救命士のうち気管挿管認定者は約89%である","一般市民目撃の心原性心停止の1カ月後社会復帰率は25.1%であった"],"a":2,"e":"127,718人、1カ月後生存8,704人(6.8%)。一般市民目撃心原性：生存13.9%、社会復帰9.1%。VF/無脈性VT：生存36.2%、社会復帰25.1%。薬剤投与認定89.1%、気管挿管認定51.4%。除細動実施は10.1%。(p231)"},{"n":72,"q":"東京消防庁のプロトコル改定（2016年）について本書の記載と合致するものはどれか。","o":["除細動は5回まで行う","搬送先病院への事前連絡は行わない","覚知から病院到着まで45分以内の搬送を目指す","原則として薬剤投与の指示要請を必ず行う","心停止から60分以内の病院到着を目指す"],"a":2,"e":"除細動適応波形の場合、現場での除細動を3回までとし、原則薬剤投与の指示要請は行わず、覚知から病院到着まで45分以内の搬送を目指す。事前にショック抵抗性VF/VTを伝えPCPS準備を開始。(p231)"},{"n":73,"q":"ECPR施行時の体温管理療法（TTM）について本書の記載と合致しないものはどれか。","o":["ECMOを用いたTTMでは、プライミング時に回路を目標温度より数℃高く設定しておく","心機能が回復し自己心拍出量がECMO流量を上回り、mixing pointが下行大動脈であればECMO流量の減量を考慮する","心停止後に生じる臓器機能不全は2008年に心停止後症候群（PCAS）と定義された","大動脈弁の開放がみられない場合はIABPやImpellaによる左室の減圧（unloading）を考慮する","Nielsenらの報告以後、36℃と32℃で神経学的予後は同等とされた"],"a":0,"e":"ECMOを用いたTTMは血液を直接冷却するため目標温度へ迅速に到達可能で、プライミング時にあらかじめ目標温度より数℃低く設定しておく必要がある。(p237)"},{"n":74,"q":"本書の表に示されたTTM復温時の管理として正しいものはどれか。","o":["復温速度0.5℃/時","ROSC後72時間以内は>36.0℃、72時間以降は>38.0℃を回避","低カリウム血症回避","目標体温37.5℃","所要時間12時間以上"],"a":1,"e":"目標体温36.0℃、復温速度0.1℃/時、所要時間36時間以上（33.0℃からの場合）。電解質は高カリウム血症回避、血糖は低血糖回避、循環は低血圧回避。(p242)"},{"n":75,"q":"ECPRの費用対効果について本書の記載と合致するものはどれか。","o":["先行研究では比較対象群が適切に設定されていることが多い","SAVE-Jの費用対効果分析は急性期・退院後ともマルコフモデルのみを用いた","日本では1QALY獲得あたり5,000〜6,000万円が支払意思額として提案されている","QALYは生存年数のみで算出される","ICERが500万円/QALY gained以下であれば医療費に見合った治療法と評価される"],"a":4,"e":"日本では1QALY獲得あたり500〜600万円が提案。QALY=QOL値×生存年数。急性期は判断樹モデル、退院後はマルコフモデル。先行研究の最大の問題は適切な比較対象群が設定されていないこと。(p243)"},{"n":76,"q":"SAVE-J studyの費用対効果分析で推定された1人あたり費用として本書に記載されたものはどれか。","o":["ECPR群 約5,400万円、non-ECPR群 約1,900万円","ECPR群 約191万円、non-ECPR群 約543万円","ECPR群 約543万円、non-ECPR群 約191万円","ECPR群 約1,000万円、non-ECPR群 約500万円","両群とも約300万円"],"a":2,"e":"ECPR群5,435,128円、non-ECPR群1,913,939円。分析モデルではCPC1〜5にmRSを割り付けたマルコフモデルを用いた。(p244)"},{"n":77,"q":"「救急・集中治療における終末期医療に関するガイドライン（3学会合同）」の終末期の判断に含まれないものはどれか。","o":["不可逆的全脳機能不全（脳死など）と診断された場合","生命が人工的な装置に依存し、生命維持に必須な複数の臓器が不可逆的機能不全となり、移植などの代替手段もない場合","さらに行うべき治療方法がなく、現状の治療を継続しても近いうちに死亡することが予測される場合","悪性腫瘍など回復不可能な疾患の末期であることが積極的治療の開始後に判明した場合","家族が延命治療の中止を希望した場合"],"a":4,"e":"a〜dの4つのいずれかが終末期の判断。家族の希望は判断後の対応の場面で扱われる。(p248)"},{"n":78,"q":"終末期と判断した後の治療法選択について本書の記載と合致しないものはどれか。","o":["延命治療を中止する方法として人工透析・血液浄化などの追加治療を行わない選択肢がある","人工心肺などの積極的治療の終了も選択肢に含まれる","積極的延命治療の中止を選択した場合は原則として家族の立ち会いの下に行う","心停止後に脳死に至った患者家族へ臓器提供の機会があることを提示することがJRC蘇生ガイドライン2015で推奨されている","生命を短縮させる意図を持つ積極的安楽死（筋弛緩薬投与など）も選択肢となりうる"],"a":4,"e":"生命を短縮させる意図を持つ積極的安楽死（筋弛緩薬投与など）は行わない。(p249)"},{"n":79,"q":"Murrayスコアの評価項目に含まれないものはどれか。","o":["PEEP","P/F比","胸部X線で浸潤影の占める割合","コンプライアンス","PaCO2"],"a":4,"e":"MurrayスコアはP/F比、胸部X線浸潤影の割合、PEEP、コンプライアンスの4項目（各0〜4点）。(p252)"},{"n":80,"q":"VV ECMOの適応・禁忌（本書の表）について正しいものはどれか。","o":["CESAR研究の適応はMurrayスコア>2である","EOLIA研究ではHITは禁忌に含まれない","4つの基準すべてで7日以上の人工呼吸器使用は適応とされている","ELSOでは7日以上の人工呼吸が絶対的禁忌である","EOLIA研究の低酸素血症基準はP/F<80（FIO2≧0.8）が6時間以上持続またはP/F<50（FIO2≧0.8）が3時間以上持続である"],"a":4,"e":"CESARはMurrayスコア>3、pH<7.20。ELSOには絶対的禁忌なし（7日以上の人工呼吸は相対的禁忌）。4基準すべてで7日以上の人工呼吸器使用は禁忌・適応外。EOLIAの除外にはHITを含む。(p252-253)"},{"n":81,"q":"VV ECMO導入時の年齢と予後について本書の記載と合致しないものはどれか。","o":["Yeoらの報告で急性呼吸不全でECMOを生存離脱した患者の6カ月生存は37%に留まった","フランスの140名の解析で年齢が1歳増加するごとに死亡オッズ比が8%上昇した","PRESERVEスコアでは55歳以上で3点加算される","ELSOレジストリー解析で65歳以上はECMOを生存離脱すれば自宅退院率は同等であった","RESPスコアでは60歳以上で3点加算（生存退院率低下）とされた"],"a":3,"e":"2012〜2017年の6,536名のELSOレジストリー解析で、65歳以上の患者はECMOを生存離脱しても自宅退院率が有意に低いことが示された。(p252-253)"},{"n":82,"q":"ECMO下の人工呼吸管理について本書の記載と合致するものはどれか。","o":["ECMO下の適切なPEEPの指標として10〜15 cmH2Oという記載がある","推奨されるプラトー圧は35 cmH2O以下である","換気回数は30〜40/分が推奨される","VV ECMOではFIO2を1.0に維持することが推奨される","4 mL/kg以下の一回換気量制限で死亡率低下が示されている"],"a":0,"e":"プラトー圧25 cmH2O以下、20〜25 cmH2O以下などの記載。4 mL/kg以下はIL-6低下の報告はあるが死亡率低下は示されていない。FIO2は0.4以下、0.3〜0.5などが推奨。換気回数は4〜5/分、4〜30/分という記載。(p258)"},{"n":83,"q":"ECMO中の自発呼吸と筋弛緩について本書の記載と合致するものはどれか。","o":["長期間の筋弛緩薬使用はICU-AWを引き起こす可能性がある","一回換気量6〜8 mL/kgに管理できる程度の部分筋弛緩では自発呼吸の害を抑制できない","過去の大規模臨床試験ACURASYS trialは筋弛緩薬を原則96時間とした","自発呼吸が強い場合、まず完全筋弛緩を48時間行うべきとされる","ROSE trialでは、筋弛緩薬群で自発呼吸温存群に比べ死亡率が有意に低下した"],"a":0,"e":"ROSE trialでは高PEEPを含む肺保護換気下で筋弛緩群は自発呼吸温存群に比べ死亡率増加や気胸を引き起こさなかった。ACURASYSにもとづき原則48時間。対応はまず鎮静・鎮痛の適正化→PEEP設定見直し→それでも困難なら完全筋弛緩48時間あるいは部分筋弛緩。(p266)"},{"n":84,"q":"妊婦におけるECMOについて本書の記載と合致しないものはどれか。","o":["妊娠第3期には心拍出量が30〜50%増加する","胎児酸素化確保のため母体PaO2を70 mmHg以上に保つ","国外報告では母体生存率は78〜91%程度、胎児生存率は65〜78%程度である","胎児の呼吸性アシドーシスを避けるため母体PaCO2は40〜45 mmHgに維持する","2015年の日本産婦人科医会のアンケートで、妊産婦のICU入室原因は産科出血が最多（57%）であった"],"a":3,"e":"母体PaCO2の上昇は胎児の呼吸性アシドーシスをきたすため、妊娠中の正常値である30〜32 mmHgを保つよう注意する。(p267)"},{"n":85,"q":"敗血症に対するECMOについて本書の記載と合致するものはどれか。","o":["Vieillardらの報告で67例の敗血症性ショックのうち約60%にLVEF低下を認めた","Brechotらの報告（14例）の生存率は約20%であった","成人の敗血症性ショックではECMOは標準的治療とされている","Huangらの報告では60歳以上で生存例が多かった","Parkらの報告（32例）の生存退院率は71%であった"],"a":0,"e":"成人では標準的治療とはみなされていない。Huangら（52例）は60歳以上が全員死亡、生存退院率15%。Brechotら（14例）は生存率71%、Parkら（32例）は生存退院率21.9%。(p276-277)"},{"n":86,"q":"COVID-19肺炎Type Lの管理としてGattinoniらが提唱した内容に含まれないものはどれか。","o":["Type Lでは腹臥位換気の適応を限定する","非常に強い吸気努力がみられる症例ではP-SILIによる肺傷害を避けるため気管挿管を優先する","全例にPEEP 15 cmH2O以上のリクルートメント手技を行う","可能な限り低いPEEPでやさしい換気を行い「時間を稼ぐ」","recruitが期待できない肺病変に対するhigh PEEP管理は避ける"],"a":2,"e":"Type Lでは重篤な循環障害や水分貯留の原因となるhigh PEEP管理を避ける。(p282)"},{"n":87,"q":"COVID-19 Type Hの管理について本書の記載と合致するものはどれか。","o":["一回換気量8〜10 mL/予測体重kgで管理する","ARDSに対して1日に8時間の腹臥位で死亡率が減少するとされる","許容できない高二酸化炭素血症とは一般にpH<7.25程度の呼吸性アシドーシスを伴うものを指す","腹臥位療法はP/F<300 mmHgで考慮する","プラトー圧≦35 cmH2Oで管理する"],"a":2,"e":"high PEEPでプラトー圧≦30 cmH2O、一回換気量6 mL/予測体重kg。P/F<150 mmHg程度で腹臥位を考慮、1日16時間の腹臥位で酸素化改善・死亡率減少とされる。(p283)"},{"n":88,"q":"体外設置型VAD（ニプロVAD）について本書の記載と合致しないものはどれか。","o":["INTERMACS profile 1の症例で救命目的に行うものをbridge to decision（BTD）という","流入・流出弁にはMedtronic-Hall弁（23 mm）が用いられている","通常は%SYS 33%前後、陽圧+220 mmHg前後、陰圧−30〜−50 mmHg前後に設定する","full empty状態を理想として設定条件を調節する","ポンプ容積は70 mLで1回拍出量は50〜60 mLとされる"],"a":3,"e":"full emptyではダイアフラムに過度のストレスがかかり損傷の原因となるため、partial empty（ポンプ内に少し血液が残りダイアフラムがハウジングに接しない）を理想とする。添付文書上ポンプ使用期間は30日。(p310-311)"},{"n":89,"q":"連続流式LVAD使用下の循環モニタリングについて正しいものはどれか。","o":["大動脈弁が閉鎖された完全左心循環 const KEY = "ecmo-pcps-mcq-v1";
const L = "abcde";
let st = {ans:{}, cur:0, mode:"all"};   // ans: {n: chosenIndex}

function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && s.ans) st = Object.assign(st, s);}catch(e){} }
function save(manual){
  let ok = true;
  try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){ ok = false; }
  const t = new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("saveStatus").textContent = ok
    ? (manual ? `${t} に保存しました。` : `${t} 自動保存済み`)
    : "このブラウザでは保存できません。進捗コードをコピーして控えてください。";
  document.getElementById("code").value = encode();
}
function encode(){ return "EP1:" + Q.map(q => st.ans[q.n]===undefined ? "-" : L[st.ans[q.n]]).join(""); }
function decode(s){
  s = (s||"").trim(); if(!s.startsWith("EP1:")) return null;
  const b = s.slice(4); if(b.length !== Q.length) return null;
  const ans = {};
  for(let i=0;i<b.length;i++){ const k = L.indexOf(b[i]); if(k>=0) ans[Q[i].n]=k; else if(b[i]!=="-") return null; }
  return ans;
}
const isOk = q => st.ans[q.n] === q.a;
function pool(){
  if(st.mode==="todo") return Q.filter(q => st.ans[q.n]===undefined);
  if(st.mode==="wrong") return Q.filter(q => st.ans[q.n]!==undefined && !isOk(q));
  return Q;
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function stats(){
  const done = Q.filter(q => st.ans[q.n]!==undefined).length;
  const ok = Q.filter(isOk).length;
  sDone.textContent = done; sOk.textContent = ok; sNg.textContent = done-ok;
  sRate.textContent = done ? Math.round(ok/done*100)+"%" : "–";
  meter.style.width = done+"%";
}

function renderQuiz(){
  const p = pool(), card = document.getElementById("card");
  if(!p.length){
    card.innerHTML = `<div class="empty">${st.mode==="wrong" ? "間違えた問題はありません。" : "未解答の問題はありません。"}</div>`;
    prev.disabled = next.disabled = true; redo.hidden = true; return;
  }
  // keep current question if it is in pool
  let idx = p.findIndex(q => q.n === st.curN);
  if(idx < 0){ idx = 0; st.curN = p[0].n; }
  const q = p[idx], chosen = st.ans[q.n], answered = chosen !== undefined;
  let html = `<div class="qhead"><span class="qno">問${q.n}</span>`;
  if(answered) html += `<span class="tag ${isOk(q)?"ok":"ng"}">${isOk(q)?"正解済み":"誤答"}</span>`;
  html += `<span class="pos">${idx+1} / ${p.length}</span></div>`;
  html += `<p class="qtext">${esc(q.q)}</p><div class="opts">`;
  q.o.forEach((o,i) => {
    let cls = "opt";
    if(answered){ if(i===q.a) cls+=" correct"; else if(i===chosen) cls+=" wrong"; }
    html += `<button class="${cls}" data-i="${i}" ${answered?"disabled":""}><span class="k">${L[i]}</span><span>${esc(o)}</span></button>`;
  });
  html += `</div>`;
  if(answered){
    const ok = isOk(q);
    html += `<div class="verdict ${ok?"":"ng"}"><h3>${ok?"正解":"不正解"} ― 正解は ${L[q.a]}</h3><p>${esc(q.e)}</p></div>`;
  }
  card.innerHTML = html;
  card.querySelectorAll(".opt:not([disabled])").forEach(b => b.onclick = () => {
    st.ans[q.n] = +b.dataset.i; save(false); renderAll(true);
  });
  prev.disabled = idx===0; next.disabled = idx===p.length-1;
  redo.hidden = !answered;
}

function renderReview(){
  const wrong = Q.filter(q => st.ans[q.n]!==undefined && !isOk(q));
  const box = document.getElementById("review");
  if(!wrong.length){ box.innerHTML = `<div class="card empty">間違えた問題はまだありません。</div>`; return; }
  box.innerHTML = `<p class="status">間違えた問題 ${wrong.length}問。問題番号を押すとその問題を解き直せます。</p>` + wrong.map(q => `
    <article class="ritem">
      <button class="chip" data-go="${q.n}">問${q.n}を解き直す</button>
      <p class="qt">${esc(q.q)}</p>
      <ul>${q.o.map((o,i)=>`<li class="${i===q.a?"c":i===st.ans[q.n]?"y":""}">${L[i]}. ${esc(o)}${i===q.a?"（正解）":i===st.ans[q.n]?"（あなたの解答）":""}</li>`).join("")}</ul>
      <p class="ex">${esc(q.e)}</p>
    </article>`).join("");
  box.querySelectorAll("[data-go]").forEach(b => b.onclick = () => retry(+b.dataset.go));
}

function renderGrid(){
  const g = document.getElementById("grid");
  g.innerHTML = Q.map(q => {
    const a = st.ans[q.n]; let c = "cell";
    if(a!==undefined) c += isOk(q) ? " ok" : " ng";
    if(q.n===st.curN && st.mode!=="review") c += " cur";
    return `<button class="${c}" data-n="${q.n}" aria-label="問${q.n}">${q.n}</button>`;
  }).join("");
  g.querySelectorAll(".cell").forEach(b => b.onclick = () => { setMode("all", +b.dataset.n); });
}

function renderAll(keepScroll){
  stats();
  const rv = st.mode==="review";
  quiz.hidden = rv; reviewSec.hidden = !rv;
  ["all","todo","wrong","review"].forEach(m => document.getElementById("m"+m[0].toUpperCase()+m.slice(1)).setAttribute("aria-pressed", st.mode===m));
  rv ? renderReview() : renderQuiz();
  renderGrid();
}
function setMode(m, n){
  st.mode = m; if(n) st.curN = n; save(false); renderAll();
  window.scrollTo({top:0});
}
function retry(n){ delete st.ans[n]; st.curN = n; st.mode = "all"; save(false); renderAll(); window.scrollTo({top:0}); }
function step(d){
  const p = pool(); const i = p.findIndex(q => q.n===st.curN);
  if(p[i+d]){ st.curN = p[i+d].n; save(false); renderAll(); window.scrollTo({top:0}); }
}

mAll.onclick = () => setMode("all");
mTodo.onclick = () => setMode("todo");
mWrong.onclick = () => setMode("wrong");
mReview.onclick = () => setMode("review");
prev.onclick = () => step(-1);
next.onclick = () => {
  // in "todo" mode the answered question leaves the pool; move to next unanswered
  if(st.mode==="todo"){ const p = pool(); const after = p.find(q => q.n > st.curN) || p[0]; if(after){ st.curN = after.n; save(false); renderAll(); window.scrollTo({top:0}); } return; }
  step(1);
};
redo.onclick = () => retry(st.curN);
saveBtn.onclick = () => save(true);
copyBtn.onclick = () => {
  const t = document.getElementById("code");
  const done = () => saveStatus.textContent = "進捗コードをコピーしました。";
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t.value).then(done).catch(() => { t.select(); saveStatus.textContent = "コードを選択しました。コピーしてください。"; });
  } else { t.select(); saveStatus.textContent = "コードを選択しました。コピーしてください。"; }
};
loadBtn.onclick = () => {
  const a = decode(code.value);
  if(!a){ saveStatus.textContent = "コードを読み込めませんでした。EP1: で始まるコード全体を貼り付けてください。"; return; }
  st.ans = a; st.mode = "all"; st.curN = (Q.find(q => a[q.n]===undefined)||Q[0]).n;
  save(true); saveStatus.textContent = "進捗コードを読み込みました。"; renderAll();
};
resetBtn.onclick = () => resetConfirm.hidden = false;
resetNo.onclick = () => resetConfirm.hidden = true;
resetYes.onclick = () => { st = {ans:{}, curN:Q[0].n, mode:"all"}; resetConfirm.hidden = true; save(true); saveStatus.textContent = "記録を消去しました。"; renderAll(); };
document.addEventListener("keydown", e => {
  if(e.target.tagName==="TEXTAREA" || st.mode==="review") return;
  const k = e.key.toLowerCase();
  if(L.includes(k) && k.length===1){ const b = document.querySelector(`.opt[data-i="${L.indexOf(k)}"]:not([disabled])`); if(b) b.click(); }
  else if(e.key==="ArrowRight") next.click();
  else if(e.key==="ArrowLeft") prev.click();
});

load();
if(!st.curN) st.curN = (Q.find(q => st.ans[q.n]===undefined)||Q[0]).n;
code.value = encode();
if(Object.keys(st.ans).length) saveStatus.textContent = `前回の続きから再開しました（${Object.keys(st.ans).length}問解答済み）。`;
renderAll();
</script>
